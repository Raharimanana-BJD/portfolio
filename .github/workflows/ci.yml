name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # Job 1: Lint et vérification du code
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Run Biome check
        run: bun run lint
      
      - name: Type check
        run: bunx tsc --noEmit

  # Job 2: Build du projet
  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build project
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: https://braharim.dev
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next/
          retention-days: 7

  # Job 3: Tests (optionnel, à activer quand vous aurez des tests)
  # test:
  #   name: Run Tests
  #   runs-on: ubuntu-latest
  #   needs: lint
  #   
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #     
  #     - name: Setup Bun
  #       uses: oven-sh/setup-bun@v2
  #     
  #     - name: Install dependencies
  #       run: bun install --frozen-lockfile
  #     
  #     - name: Run tests
  #       run: bun run test

  # Job 4: Analyse SEO et vérification des liens
  seo-check:
    name: SEO & Link Check
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .next/
      
      - name: Start Next.js server
        run: bun run start &
        env:
          NEXT_PUBLIC_SITE_URL: https://braharim.dev
      
      - name: Wait for server
        run: bunx wait-on http://localhost:3000 -t 30000
      
      - name: Check sitemap
        run: |
          curl -f http://localhost:3000/sitemap.xml || exit 1
          echo "✅ Sitemap accessible"
      
      - name: Check robots.txt
        run: |
          curl -f http://localhost:3000/robots.txt || exit 1
          echo "✅ Robots.txt accessible"

  # Job 5: Notification de succès
  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [lint, build, seo-check]
    if: success()
    
    steps:
      - name: Success notification
        run: |
          echo "🎉 Pipeline CI/CD réussi !"
          echo "✅ Lint: OK"
          echo "✅ Build: OK"
          echo "✅ SEO Check: OK"
